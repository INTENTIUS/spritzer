# GoReleaser configuration. See https://goreleaser.com
version: 2

project_name: spritzer

before:
  hooks:
    - go mod tidy

builds:
  - id: spritzer
    main: ./cmd/spritzer
    binary: spritzer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: spritzer
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# chant release runs goreleaser with --snapshot at the cut; the snapshot
# version is the release label, so the binaries carry it. The container image
# is built by chant from the Dockerfile (release.images in chant.config.json).
snapshot:
  version_template: "{{ .Env.CHANT_RELEASE_LABEL }}"

